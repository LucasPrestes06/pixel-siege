<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL SIEGE — Platform Shooter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===================== MENU ===================== -->
  <div class="screen active" id="menuScreen">
    <div class="panel">
      <div class="brand">
        <h1>PIXEL<span>SIEGE</span></h1>
        <p>PLATFORM SHOOTER · ARENA LOCAL</p>
      </div>

      <label>SEU NOME DE GUERRA</label>
      <input type="text" id="nameInput" maxlength="12" placeholder="JOGADOR">

      <button class="btn primary" id="btnCreate">
        CRIAR SALA
        <small>gera um código de 4 letras para os outros entrarem</small>
      </button>
      <button class="btn accent" id="btnShowJoin">
        ENTRAR EM SALA
        <small>use o código que o host compartilhou</small>
      </button>

      <div id="joinBox" style="display:none;margin-top:10px;">
        <label>CÓDIGO DA SALA</label>
        <input type="text" id="codeInput" maxlength="4" placeholder="EX: WSPH" style="text-transform:uppercase;text-align:center;">
        <button class="btn primary" id="btnJoin">ENTRAR</button>
      </div>
    </div>
  </div>

  <!-- ===================== LOBBY ===================== -->
  <div class="screen" id="lobbyScreen">
    <div class="panel">
      <div class="brand">
        <h1 style="font-size:1.3rem;">SALA DE ESPERA</h1>
      </div>
      <div class="hint">CÓDIGO DA SALA — compartilhe com os outros jogadores</div>
      <div class="code-box" id="codeBox"></div>

      <ul class="player-list" id="playerList"></ul>

      <button class="btn primary" id="btnStart" style="margin-top:16px;">INICIAR PARTIDA</button>
      <div class="back-link" id="btnLeaveLobby">‹ sair da sala</div>
    </div>
  </div>

  <!-- ===================== GAME ===================== -->
  <div class="screen" id="gameScreen">
    <div id="stage">
      <canvas id="game" width="720" height="405"></canvas>
      <canvas id="uiLayer"></canvas>
      <div id="hud">
        <div id="roomTag"></div>
        <button class="btn" id="exitBtn" style="padding:6px 10px;font-size:.65rem;width:auto;">SAIR</button>

        <div id="scoreboard"></div>
        <div id="killfeed"></div>

        <div id="hpWrap">
          <div id="hpLabel">VIDA</div>
          <div id="hpBar"><div id="hpFill"></div></div>
        </div>

        <div id="weaponHud">
          <div class="wname" id="wname">ESPADA</div>
          <div class="wammo" id="wammo"></div>
          <div class="wkeys">
            <div class="wkey active" data-w="sword">1</div>
            <div class="wkey" data-w="gun">2</div>
          </div>
        </div>

        <div id="respawnOverlay">
          <h2>VOCÊ FOI ELIMINADO</h2>
          <div class="n" id="respawnNum">3</div>
        </div>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
